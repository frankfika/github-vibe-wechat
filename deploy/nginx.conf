upstream omniwriter_app {
  zone omniwriter_app 64k;
  least_conn;
  server 127.0.0.1:3011 max_fails=1 fail_timeout=10s;
  server 127.0.0.1:3012 max_fails=1 fail_timeout=10s;
  # 固定端口切换也避免复用已下线进程的空闲连接。
}

server {
  listen 80;
  # Replace this before enabling the site on the host Nginx.
  server_name omniwriter.example.com;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/health {
    access_log off;
    proxy_pass http://omniwriter_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 100ms;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 3s;
  }

  location = /api/ready {
    access_log off;
    proxy_pass http://omniwriter_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 100ms;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 3s;
  }

  location / {
    proxy_pass http://omniwriter_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection close;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 100ms;
    proxy_read_timeout 180s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 3s;
  }
}
