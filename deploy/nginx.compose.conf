upstream omniwriter_app {
  zone omniwriter_app 64k;
  least_conn;
  resolver 127.0.0.11 valid=1s ipv6=off;
  server app-a:3000 resolve max_fails=1 fail_timeout=10s;
  server app-b:3000 resolve max_fails=1 fail_timeout=10s;
  # 不缓存到容器 IP 的空闲 upstream 连接；滚动重建时优先保证零丢请求。
}

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  location / {
    proxy_pass http://omniwriter_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection close;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 100ms;
    proxy_read_timeout 180s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 3s;
  }
}
