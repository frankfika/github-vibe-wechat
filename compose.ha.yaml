x-app-env: &app-env
  NODE_ENV: production
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-MiniMax-M2.7}
  FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}

x-app: &app
  image: ${OMNIWRITER_IMAGE_REPOSITORY:-omniwriter}:${APP_VERSION:-local}
  restart: unless-stopped
  init: true
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ready"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 20s
  networks: [omniwriter]

services:
  app-a:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-a
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:${OMNIWRITER_PORT_A:-3011}:3000"
  app-b:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-b
    ports:
      - "127.0.0.1:${OMNIWRITER_PORT_B:-3012}:3000"

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    init: true
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OMNIWRITER_GATEWAY_PORT:-3080}:80"
    volumes:
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [omniwriter]

networks:
  omniwriter:
