<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pencil · 中文写作与多平台排版</title>
<style>
:root{
  --ink:#1d1d1f; --soft:#29292c; --muted:#86868b; --line:#d2d2d7; --panel:#f5f5f7;
  --wx-canvas:#fff; --wx-primary:#1d1d1f; --wx-body:#29292c; --wx-muted:#86868b;
  --wx-hairline:#d2d2d7; --wx-soft:#f5f5f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--panel);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:300px 1fr 400px;height:100vh;overflow:hidden}
.pane{display:flex;flex-direction:column;min-width:0}
.left{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:16px}
.mid{border-right:1px solid var(--line);background:#fff}
.right{background:#fff;display:flex;flex-direction:column}
h1.logo{font-size:15px;font-weight:700;margin:0 0 14px;letter-spacing:-0.01em}
label{display:block;font-size:11px;font-weight:600;color:var(--soft);margin:12px 0 4px}
input[type=text],textarea,select{width:100%;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:inherit;color:var(--soft);background:#fff}
textarea{resize:vertical;line-height:1.6}
button{cursor:pointer;border:none;border-radius:6px;font-family:inherit}
.btn{background:var(--ink);color:#fff;padding:8px 14px;font-size:13px;font-weight:500}
.btn:hover{background:#000}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.ghost:hover{background:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:4px 10px;font-size:12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--soft)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 工具栏 */
.toolbar{display:flex;gap:2px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.toolbar button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--soft);border-radius:5px;font-size:14px}
.toolbar button:hover{background:var(--panel)}
.toolbar button.on{background:var(--panel);color:var(--ink);font-weight:700}
.toolbar .spacer{flex:1}
.toolbar .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 编辑器 */
.editor{flex:1;overflow-y:auto}
.editor .inner{max-width:65ch;margin:0 auto;padding:28px 32px;font-size:16px;line-height:1.75;color:var(--soft);outline:none;min-height:100%}
.editor h1{font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-0.014em;color:var(--ink);margin:0 0 14px}
.editor h2{font-size:20px;font-weight:650;line-height:1.3;color:var(--ink);margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.editor p{margin:0 0 12px}
.editor blockquote{background:var(--panel);border-left:3px solid var(--ink);padding:10px 14px;margin:14px 0;border-radius:0 4px 4px 0}
.editor img{max-width:100%;border-radius:4px;margin:14px 0;display:block}
.editor figure{margin:14px 0}
.editor figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.editor ul,.editor ol{padding-left:22px;margin:0 0 12px}
.editor code{background:var(--panel);padding:2px 6px;border-radius:3px;font-size:.92em;font-family:"JetBrains Mono",ui-monospace,monospace}
.editor:empty::before{content:attr(data-ph);color:var(--muted)}
/* 右侧：预览 + 平台 */
.right .head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--soft)}
.right .head .spacer{flex:1}
.preview{flex:1;overflow-y:auto;background:var(--panel);padding:18px}
.preview .phone{background:var(--wx-canvas);max-width:375px;margin:0 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.wx{font-size:16px;line-height:1.9;color:var(--wx-body);padding:22px 18px 40px}
.wx h1{font-size:21px;font-weight:700;line-height:1.32;color:var(--wx-primary);margin:0 0 12px;letter-spacing:-0.011em}
.wx h2{font-size:17px;font-weight:650;color:var(--wx-primary);margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--wx-hairline)}
.wx p{margin:0 0 12px}
.wx blockquote{background:var(--wx-soft);border-left:3px solid var(--wx-primary);padding:9px 13px;margin:14px 0;color:var(--wx-body)}
.wx img{width:100%;border-radius:4px;margin:16px 0;display:block}
.wx figure{margin:16px 0}
.wx figcaption{font-size:12px;color:var(--wx-muted);margin-top:5px;line-height:1.5}
/* 平台 tab */
.platforms{height:46%;border-top:1px solid var(--line);display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:6px 11px;font-size:12px;background:transparent;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.pf-body{flex:1;display:flex;flex-direction:column;padding:10px 12px;gap:8px;min-height:0}
.pf-body textarea{flex:1;min-height:80px;resize:none;font-size:13px;line-height:1.6}
.pf-row{display:flex;gap:8px;align-items:center}
.pf-meta{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
@media(max-width:1100px){#app{grid-template-columns:1fr}#app>*{display:none}#app>.mid{display:flex}}
</style>
</head>
<body>
<div id="app">
  <!-- 左：创作指令 -->
  <div class="pane left">
    <h1 class="logo">Pencil · 中文写作 × 多平台排版</h1>
    <label>素材类型</label>
    <select id="matType">
      <option value="news">新闻 / 事件 / 资讯</option>
      <option value="project">自有项目 / 推荐项目</option>
      <option value="topic" selected>观点 / 话题 / 随笔</option>
      <option value="copy">已有文案（只排版）</option>
    </select>
    <label>素材（新闻链接 / 文本 / 主题）</label>
    <textarea id="material" rows="4" placeholder="粘贴新闻链接或文本，或写下你的主题…"></textarea>
    <label>角度 / 立场（文章的灵魂）</label>
    <textarea id="angle" rows="2" placeholder="我主要想表达……"></textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>语气</label>
        <select id="voice">
          <option value="relaxed">relaxed 轻松口语</option>
          <option value="editorial">editorial 克制评论</option>
          <option value="technical">technical 技术</option>
          <option value="market">market 商业分析</option>
        </select></div>
      <div><label>长度</label>
        <select id="length">
          <option value="short">短 &lt;800字</option>
          <option value="medium" selected>中 800–2000</option>
          <option value="long">长 &gt;2000</option>
        </select></div>
    </div>
    <label>平台</label>
    <div class="chips" id="platformChips"></div>
    <label>AI Key（可选，存本机浏览器）</label>
    <input type="text" id="aiKey" placeholder="MiniMax key，如 sk-…"/>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn" id="genBtn" style="flex:1">生成母稿</button>
      <button class="btn ghost" id="applyBtn" title="把编辑器当前内容套到公众号石墨风预览">预览排版</button>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn ghost" id="copyBtn" style="flex:1">复制公众号正文</button>
      <button class="btn ghost" id="dlBtn">下载 HTML</button>
    </div>
    <p id="status" style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6">双击打开即用。填了 AI Key 才能"生成"；不填也能手动写 + 排版 + 复制。</p>
  </div>

  <!-- 中：编辑器 -->
  <div class="pane mid">
    <div class="toolbar">
      <button data-cmd="h1" title="H1">H1</button>
      <button data-cmd="h2" title="H2">H2</button>
      <button data-cmd="bold" title="加粗">B</button>
      <button data-cmd="italic" title="斜体">I</button>
      <button data-cmd="blockquote" title="引用">❝</button>
      <button data-cmd="insertUnorderedList" title="列表">•≡</button>
      <button data-cmd="insertImage" title="图片">🖼</button>
      <span class="spacer"></span>
      <span class="count" id="charCount"></span>
    </div>
    <div class="editor"><div class="inner" id="doc" contenteditable="true" data-ph="从这里开始写，或点左侧「生成母稿」…"></div></div>
  </div>

  <!-- 右：公众号预览 + 平台稿 -->
  <div class="pane right">
    <div class="head">
      <span>公众号预览</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="copyBtn2" style="font-size:12px;padding:5px 10px">复制公众号正文</button>
    </div>
    <div class="preview"><div class="phone"><div class="wx" id="wxPreview"></div></div></div>
    <div class="platforms">
      <div class="tabs" id="pfTabs"></div>
      <div class="pf-body">
        <div class="pf-meta" id="pfMeta"></div>
        <textarea id="pfText" placeholder="点「适配此平台」生成该平台的改写稿，也可手动写。"></textarea>
        <div class="pf-row">
          <button class="btn" id="pfAdapt" style="font-size:12px;padding:6px 12px">适配此平台</button>
          <button class="btn ghost" id="pfCopy" style="font-size:12px;padding:6px 12px">复制文案</button>
          <span class="spacer" style="flex:1"></span>
          <span class="pf-meta" id="pfLen"></span>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const PLATFORMS = [
  {id:'x', label:'X', shape:'短帖 ≤240 字含 URL', depth:'精简', official:'https://twitter.com/intent/tweet', rule:'≤240 中文字符含 URL；痛点/惊讶开场；1–2 个相关 hashtag；不用 Markdown 链接；结尾给具体邀请。'},
  {id:'zhihu', label:'知乎', shape:'中文长文回答', depth:'全量', official:'https://www.zhihu.com/', rule:'围绕用户问题、实现选择、局限、实际用法展开；保留事实深度与来源。'},
  {id:'xiaohongshu', label:'小红书', shape:'图文笔记', depth:'精简', official:'https://creator.xiaohongshu.com/', rule:'短标题、图先文后、结尾互动问题、5–8 个相关标签；口语化但不夸张；避免"爆款/永久安全"承诺。'},
  {id:'bilibili', label:'B站', shape:'视频/专栏发布包', depth:'中', official:'https://member.bilibili.com/v2/', rule:'视频标题、简介、分段口播提纲、置顶评论、标签；不伪装成自动上传。'},
  {id:'csdn', label:'CSDN', shape:'技术文章', depth:'全量技术', official:'https://editor.csdn.net/md/', rule:'问题→架构→安全→部署→用法→局限→源码；Markdown 结构清晰；给出参考链接与许可证。'},
  {id:'reddit', label:'Reddit', shape:'第一人称透明帖', depth:'中', official:'https://www.reddit.com/', rule:'第一人称、披露作者身份；只出现一次 URL；不要求点赞；语气真实可讨论。'},
  {id:'hn', label:'HN', shape:'Show HN 文本帖', depth:'技术+个人', official:'https://news.ycombinator.com/submit', rule:'Show HN: 标题；动机+端到端流程+关键设计选择+技术栈+仓库+具体讨论问题；不要求投票。'},
  {id:'ph', label:'Product Hunt', shape:'发布工作表+Maker Comment', depth:'字段化', official:'https://www.producthunt.com/posts/new', rule:'产品名、标语、短描述、Topics、第一人称 Maker Comment（动机/流程/限制/反馈请求）。'},
];
const DEFAULT_PLATFORMS = ['wechat','x','zhihu','xiaohongshu'];
let curPlatform = 'x';
let drafts = {};

/* ---------- 平台 chips & tabs ---------- */
function renderChips(){
  const sel = JSON.parse(localStorage.getItem('pencil:platforms') || JSON.stringify(DEFAULT_PLATFORMS));
  $('#platformChips').innerHTML = PLATFORMS.map(p =>
    `<button class="chip${sel.includes(p.id)?' on':''}" data-id="${p.id}">${p.label}</button>`).join('');
  document.querySelectorAll('#platformChips .chip').forEach(b=>{
    b.onclick=()=>{
      let s=JSON.parse(localStorage.getItem('pencil:platforms')||JSON.stringify(DEFAULT_PLATFORMS));
      s.includes(b.dataset.id)?s=s.filter(x=>x!==b.dataset.id):s.push(b.dataset.id);
      localStorage.setItem('pencil:platforms',JSON.stringify(s)); renderChips();
    };
  });
}
function renderTabs(){
  const sel=JSON.parse(localStorage.getItem('pencil:platforms')||JSON.stringify(DEFAULT_PLATFORMS));
  const ids=['wechat',...sel.filter(x=>x!=='wechat')];
  $('#pfTabs').innerHTML=ids.map(id=>{
    const p=PLATFORMS.find(x=>x.id===id);
    return `<button class="${id===curPlatform?'on':''}" data-id="${id}">${p?p.label:id}</button>`;
  }).join('');
  document.querySelectorAll('#pfTabs button').forEach(b=>{b.onclick=()=>{curPlatform=b.dataset.id;renderTabs();renderPf();};});
}
function renderPf(){
  const p=PLATFORMS.find(x=>x.id===curPlatform);
  $('#pfMeta').textContent = p?`${p.label} · ${p.shape} · ${p.depth}`:'';
  $('#pfText').value = drafts[curPlatform]||'';
  $('#pfLen').textContent = ($('#pfText').value.length)+' 字';
  $('#pfCopy').style.display = curPlatform==='wechat'?'none':'';
  $('#pfAdapt').textContent = drafts[curPlatform]?'重新适配':'适配此平台';
}

/* ---------- 编辑器 ---------- */
const doc=$('#doc');
document.querySelectorAll('.toolbar [data-cmd]').forEach(b=>{
  b.onclick=()=>{
    const c=b.dataset.cmd;
    doc.focus();
    if(c==='h1')document.execCommand('formatBlock',false,'H1');
    else if(c==='h2')document.execCommand('formatBlock',false,'H2');
    else if(c==='insertImage'){const u=prompt('图片 URL / dataURL：');if(u){const cap=prompt('图注：')||'';insertImage(u,cap);}}
    else document.execCommand(c,false,null);
    sync();
  };
});
function insertImage(src,cap){
  const fig=document.createElement('figure');
  const img=document.createElement('img');img.src=src;img.alt=cap||'图片';
  fig.appendChild(img);
  if(cap){const fg=document.createElement('figcaption');fg.textContent=cap;fig.appendChild(fg);}
  doc.appendChild(fig);
}
doc.addEventListener('input',sync);
doc.addEventListener('keyup',sync);
function sync(){
  $('#charCount').textContent=(doc.innerText.replace(/\s/g,'').length)+' 字';
  renderPreview();
  autoSave();
}

/* ---------- 公众号预览 ---------- */
function renderPreview(){
  $('#wxPreview').innerHTML = doc.innerHTML || '<p style="color:#86868b">预览会实时出现</p>';
}

/* ---------- AI ---------- */
const ENDPOINT='https://api.minimaxi.com/anthropic/v1/messages';
const MODEL='MiniMax-M3';
function getKey(){return ($('#aiKey').value||localStorage.getItem('pencil:key')||'').trim();}
$('#aiKey').addEventListener('input',e=>{if(e.target.value)localStorage.setItem('pencil:key',e.target.value);});
$('#aiKey').value=localStorage.getItem('pencil:key')||'';

const RULES=`## 编辑准则
1. 论点先行：动笔前想清"这篇文章要论证什么、因为什么"。用最强的判断，不用最安全的概括。
2. 一条论证主线：事件/引语开场→暴露矛盾→讲清机制→谁受益/谁受损→更大的判断。不硬套编号小标题。
3. 去掉 AI 味：避免"第一第二第三"节奏、"这意味着/值得注意的是"堆砌、对称排比、空泛结尾、"重磅/深度解析/一文看懂"标签词。优先第一人称观察、具体名词、长短句交替。
4. 图片按阅读顺序 01_ 命名，紧跟"图 N｜描述。图片来源：…"。
5. 标题最后拟："人物/事件 + 出人意料判断 + 未来方向"，具体能承诺论点，自然能读出声。
6. 新闻类强制事实核查：区分事实/来源声称/推断；禁止编造引语数字；来源声称写"据 X 报道"；未核实不写"首个/独家/最大"。`;

async function callAI(system,user){
  const key=getKey();
  if(!key)throw new Error('请先填 AI Key');
  const res=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:MODEL,max_tokens:3000,system,messages:[{role:'user',content:user}]})});
  if(!res.ok){const t=await res.text();throw new Error('AI 请求失败 HTTP '+res.status+': '+t.slice(0,120));}
  const data=await res.json();
  return data.content.map(b=>b.type==='text'?b.text:'').join('');
}
$('#genBtn').onclick=async()=>{
  const b=$('#genBtn');b.disabled=true;b.textContent='生成中…';toast('生成中，可能需几十秒');
  try{
    const angle=$('#angle').value.trim()||'从素材提炼';
    const user=`素材：\n${$('#material').value||'(无素材，按主题自由发挥)'}\n\n创作指令：\n- 角度/立场：${angle}\n- 语气：${$('#voice').value}\n- 长度：${$('#length').value==='short'?'短（<800字）':$('#length').value==='long'?'长（>2000字）':'中（800-2000字）'}\n- 标题：${$('#matType').value==='news'?'最后拟，不用重磅/深度解析/一文看懂':'按编辑准则最后拟'}\n\n仅输出 Markdown，从"# 标题"开始。`;
    const md=await callAI(RULES,user);
    doc.innerHTML=md2html(md);sync();toast('母稿已生成');
  }catch(e){toast('❌ '+e.message);}finally{b.disabled=false;b.textContent='生成母稿';}
};
$('#pfAdapt').onclick=async()=>{
  if(curPlatform==='wechat'){toast('公众号就是母稿，直接复制即可');return;}
  const p=PLATFORMS.find(x=>x.id===curPlatform);
  const b=$('#pfAdapt');b.disabled=true;b.textContent='适配中…';
  try{
    const text=await callAI('你是中文写作助手，把公众号母稿改写到指定平台。规则：'+p.rule+'；保留事实对等（动机/痛点/工作流/限制/链接）；禁止复制同一段文案；仅输出最终文案。',
      '母稿：\n'+doc.innerText+'\n\n目标平台：'+p.label);
    drafts[curPlatform]=text;$('#pfText').value=text;$('#pfLen').textContent=text.length+' 字';
    toast(p.label+' 适配稿已生成');
  }catch(e){toast('❌ '+e.message);}finally{b.disabled=false;b.textContent=drafts[curPlatform]?'重新适配':'适配此平台';}
};

/* ---------- Markdown → HTML（够公众号用） ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md2html(md){
  let h=esc(md);
  h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<figure><img src="$2" alt="$1"/><figcaption>$1</figcaption></figure>');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  h=h.replace(/^###\s+(.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/^##\s+(.*)$/gm,'<h2>$1</h2>');
  h=h.replace(/^#\s+(.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/^>\s?(.*)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  return h.split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';return /^<(h\d|figure|blockquote|ul|ol|hr|pre|img)/.test(b)?b:'<p>'+b.replace(/\n/g,'<br/>')+'</p>';}).join('\n');
}

/* ---------- 复制 & 下载 ---------- */
async function copyRich(){
  const html='<div style="font-size:16px;line-height:1.9;color:#29292c;font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,sans-serif;">'+doc.innerHTML+'</div>';
  const text=doc.innerText;
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
      toast('已复制，去公众号粘贴');return;
    }
  }catch(e){}
  try{await navigator.clipboard.writeText(text);toast('已复制（纯文本）');}catch(e){toast('复制失败，请手动选择');}
}
$('#copyBtn').onclick=copyRich;$('#copyBtn2').onclick=copyRich;
$('#pfCopy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('#pfText').value);toast('已复制 '+PLATFORMS.find(x=>x.id===curPlatform).label+' 文案');}
  catch(e){toast('复制失败');}
};
$('#dlBtn').onclick=()=>{
  const wxStyle='body{margin:0;background:#fff;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}body{padding:24px 20px 80px}h1{font-size:22px;font-weight:700;line-height:1.32;margin:0 0 14px}h2{font-size:18px;font-weight:650;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid #d2d2d7}p{margin:0 0 14px;font-size:16px;line-height:1.9;color:#29292c}blockquote{background:#f5f5f7;border-left:3px solid #1d1d1f;padding:10px 14px;margin:16px 0}img{width:100%;border-radius:4px;margin:18px 0}figure{margin:18px 0}figcaption{font-size:13px;color:#86868b;margin-top:6px}';
  const html='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>文章</title><style>'+wxStyle+'</style></head><body>'+doc.innerHTML+'</body></html>';
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='article.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('已下载 article.html');
};

/* ---------- 自动保存 ---------- */
function autoSave(){
  try{localStorage.setItem('pencil:doc',doc.innerHTML);}catch(e){}
}
window.addEventListener('load',()=>{
  const saved=localStorage.getItem('pencil:doc');
  if(saved){doc.innerHTML=saved;}
  renderPreview();sync();
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* init */
renderChips();renderTabs();renderPf();
$('#applyBtn').onclick=()=>{renderPreview();toast('已按当前编辑内容刷新公众号预览');};
sync();
</script>
