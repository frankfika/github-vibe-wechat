# ============================================================
# AI-Native Creator Platform — 用户自配置中心
# 安装到 ~/.agents/skills/creator-platform/config/creator.yaml 后，
# 改安装目录里的这份文件即可生效；仓库内这份是默认模板。
# ============================================================

# 默认产出哪些平台（子 skill 可被单次指令覆盖）
# 可用值: wechat, x, reddit, hacker-news, zhihu, csdn, product-hunt, bilibili, xiaohongshu
default_platforms:
  - wechat
  - x
  - zhihu
  - xiaohongshu

# 中英双语默认开关（仅当素材/项目具备双语界面或双语受众时建议 true）
bilingual: false

# 公众号（母稿）默认口径
wechat:
  series_title: ""            # 系列标题前缀，如 "Vibe Coding｜"；空 = 不用系列前缀
  default_eyebrow: "FRANK'S AI NOTES / TOPIC"
  account_name: "陈放Frank"    # 文末落款与发布账号
  author_signature: ""        # 文末自定义签名（可为空）

# 默认文风口径（relaxed / editorial / technical / market）
# relaxed=轻松口语、editorial=克制评论、technical=技术文章、market=商业分析
voice: relaxed

# 新闻渠道默认口径（news-to-content 使用）
news:
  default_eyebrow: "FIELD NOTES / NEWS"
  fact_check: true            # 默认强制事实核查
  default_angle: ""           # 未给角度时的兜底角度，如 "行业格局变化"；空 = 由素材提炼

# 存档：所有文章的产出目录（按 articles/<slug>/ 归档）
archive_root: "articles"

# 渲染引擎路径（缺省自动探测 ~/.codex/skills/wechat-silicon-editor）
engine_root: ""

# 每条指令生成时，是否询问缺失的关键项（角度/平台/长度）
ask_when_missing: true
